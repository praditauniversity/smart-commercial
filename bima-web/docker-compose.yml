name: bima-web

# By default both services read the same .env files as the native setup. For local Supabase,
# point WEB_ENV_FILE and AI_ENV_FILE at private .env.local copies to keep cloud settings available
# for rollback. Only container-specific network addresses are overridden below.

services:
  web:
    build:
      context: ./web
      secrets:
        - web_env
    env_file: ${WEB_ENV_FILE:-./web/.env}
    environment:
      # On the compose network the AI service is reached by name, not on loopback.
      FASTAPI_SERVICE_URL: http://ai-service:8000
      # Blank keeps cloud mode on the app's public URL; set this in the root .env.local for Docker Supabase.
      SUPABASE_INTERNAL_URL: ${SUPABASE_INTERNAL_URL:-}
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
    networks:
      - default
      - supabase
    ports:
      # Loopback only: Tailscale Serve terminates HTTPS in front of this.
      # The session cookie is Secure in production, so plain http://<lan-ip>:<port> cannot log in.
      # Host port is configurable so this can run alongside a native dev server on 3000; Tailscale
      # Serve forwards to a fixed port, so point it at whatever WEB_HOST_PORT is set to.
      - "127.0.0.1:${WEB_HOST_PORT:?set WEB_HOST_PORT in bima-web/.env (see .env.example)}:3000"
    depends_on:
      # Only ordering, not health: login, review and dashboard work without the AI service, so a
      # GPU or SAM3 problem must not keep the whole UI down. Media processing fails loudly instead.
      ai-service:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ai-service:
    build:
      context: ./ai-service
    env_file: ${AI_ENV_FILE:-./ai-service/.env}
    environment:
      # Listens on all interfaces *within* the container. It is still unreachable from the
      # network because no port is published: the compose network replaces loopback as the
      # trust boundary, and X-Internal-Secret still guards every endpoint.
      AI_SERVICE_HOST: 0.0.0.0
      AI_SERVICE_PORT: 8000
      SAM3_CHECKPOINT: /weights/sam3_1.pt
      # Provider YOLO (6 model kategori, RQ4): folder bobot di-mount read-only, tidak di-bake ke image.
      YOLO_WEIGHTS_DIR: /weights/yolo
      FFMPEG_PATH: /usr/bin/ffmpeg
      WEB_BASE_URL: http://web:3000
      SUPABASE_INTERNAL_URL: ${SUPABASE_INTERNAL_URL:-}
    networks:
      - default
      - supabase
    volumes:
      # The 3.3 GB checkpoint is mounted read-only, never baked into the image.
      - ${SAM3_WEIGHTS_HOST_PATH:?set SAM3_WEIGHTS_HOST_PATH in bima-web/.env (see .env.example)}:/weights/sam3_1.pt:ro
      # Folder berisi <kategori>-best.pt (pavedroad, vegetation, weeds, sign, banner, house_notice). Belum diuji di Docker.
      - ${YOLO_WEIGHTS_HOST_PATH:-./ai-service/models/yolo11n_seed0}:/weights/yolo:ro
    gpus: all
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # One-off: docker compose --profile tools run --rm migrate
  migrate:
    profiles: ["tools"]
    build:
      context: ./web
      target: builder
      # Same builder stage as `web`, so it needs the same build secret.
      secrets:
        - web_env
    env_file: ${WEB_ENV_FILE:-./web/.env}
    networks:
      - default
      - supabase
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

secrets:
  web_env:
    file: ${WEB_ENV_FILE:-./web/.env}

networks:
  supabase:
    external: true
    name: bima-supabase-app
